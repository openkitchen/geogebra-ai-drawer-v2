[project]
name = "geogebra-ai-drawer-api"
version = "0.0.0"
description = "GeoGebra AI Drawer v2 API (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.0",
  "uvicorn[standard]==0.40.0",
  "sse-starlette==3.1.1",
  "langchain==1.2.0",
  "langchain-openai==1.1.6",
  "langgraph==1.0.5",
  "langsmith==0.5.2",
  "openai==1.109.1",
  "python-dotenv==1.1.1",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
